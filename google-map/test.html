<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Draggable Shapes on Canvas</title>
    <style>
      body {
        font-family: sans-serif;
        color: #555;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: auto;
      }
      #mapDiv {
        position: absolute;
        top: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="mapDiv"></div>
  </body>
  <!-- <script src="https://maps.googleapis.com/maps/api/js?libraries=places"></script> -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD4osxhfNtaLK3w-YiNpsM6aTznfajuAUk&callback=initMap"
    async
    defer
  ></script>
  <script>
    function radians(degrees) {
      return (Math.PI * degrees) / 180;
    }
    let shapes = [];

    window.initMap = initMap; // Ensure initMap is globally accessible

    // Initialize Google Map
    function initMap() {
      const map = new google.maps.Map(document.getElementById("mapDiv"), {
        center: { lat: 42.3643, lng: -71.1913 },
        zoom: 10,
      });

      const overlayer = new Overlayer(document.body);
      const cartesia = new Cartesia(map);


      google.maps.event.addListenerOnce(map, "idle", function () {
        const mapDiv = map.getDiv();
        overlayer.resize(mapDiv.offsetWidth, mapDiv.offsetHeight);

        const rect = { x: 100, y: 100, width: 60, height: 60, type: "rect" };
        const circle = { x: 200, y: 200, radius: 30, type: "circle" };

        shapes.push(rect, circle);
        overlayer.drawShapes(shapes);
      });
    }

    function Overlayer(element) {
      this.canvas = document.createElement("canvas");
      this.context = this.canvas.getContext("2d");

      let draggingShape = null;
      let offsetX, offsetY;

      this.resize = function (width, height) {
        this.canvas.width = width;
        this.canvas.height = height;
        element.appendChild(this.canvas);
      };

      this.drawShapes = function (shapes) {
        const ctx = this.context;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        shapes.forEach((shape) => {
          ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
          if (shape.type === "rect") {
            ctx.fillRect(shape.x, shape.y, shape.width, shape.height);
          } else if (shape.type === "circle") {
            ctx.beginPath();
            ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      };

      this.findShape = function (x, y) {
        for (let i = shapes.length - 1; i >= 0; i--) {
          const shape = shapes[i];
          if (
            shape.type === "rect" &&
            x >= shape.x &&
            x <= shape.x + shape.width &&
            y >= shape.y &&
            y <= shape.y + shape.height
          ) {
            return shape;
          } else if (shape.type === "circle") {
            const dx = x - shape.x;
            const dy = y - shape.y;
            if (Math.sqrt(dx * dx + dy * dy) <= shape.radius) {
              return shape;
            }
          }
        }
        return null;
      };

      document.addEventListener("mousedown", (e) => {
        const rect = this.canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const shape = this.findShape(mouseX, mouseY);

        if (shape) {
          draggingShape = shape;
          offsetX = mouseX - (shape.type === "rect" ? shape.x : shape.x);
          offsetY = mouseY - (shape.type === "rect" ? shape.y : shape.y);
          this.canvas.style.pointerEvents = "auto"; // Ensure canvas is active when clicking shapes
        } else {
          this.canvas.style.pointerEvents = "none"; // Disable pointer events if clicking outside
        }
      });

      this.canvas.addEventListener("mousemove", (e) => {
        if (!draggingShape) return;
        const rect = this.canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        if (draggingShape.type === "rect") {
          draggingShape.x = mouseX - offsetX;
          draggingShape.y = mouseY - offsetY;
        } else if (draggingShape.type === "circle") {
          draggingShape.x = mouseX;
          draggingShape.y = mouseY;
        }
        this.drawShapes(shapes);
      });

      this.canvas.addEventListener("mouseup", () => {
        draggingShape = null;
      });
    }

    function Cartesia(map) {
      this.map = map;
      this.mapValue = function (val, min, max, newMin, newMax) {
        return ((val - min) * (newMax - newMin)) / (max - min) + newMin;
      };
    }
  </script>
</html>
