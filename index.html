<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Polygon Clipping and Merging</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="control-panel">
        <h3>Camera Controls</h3>
        <button class="btn_add_fisheye" id="f_8mp_btn">Add 8MP Fisheye</button>
        <button class="btn_add_fisheye" id="f_12mp_btn">Add 12Mp Fisheye</button>
        <button class="btn_add_fisheye" id="f_125mp_btn">Add 12.5MP Fisheye</button>
        <button class="btn_add_zoom" id="2mp_btn">Add 2MP Zoom</button>
        <button class="btn_add_zoom" id="4mp_btn">Add 4MP Zoom</button>
        <button class="btn_add_zoom" id="8mp_btn">Add 8MP Zoom</button>
        <label id="customFileInput" for="fileInput">Choose an Image</label>
        <input type="file" id="fileInput" accept="image/*" />
      </div>
      <canvas id="finalCanvas" width="600" height="600"></canvas>
      <div class="control-panel">
        <h3>Camera List</h3>
        <div id="cam-list0">
          <ul id="camera-name-list" class="camera-list"></ul>
          <ul id="camera-type-list" class="camera-list"></ul>
          <ul id="camera-vision-list" class="camera-list"></ul>
        </div>
      </div>
    </div>

    <canvas
      id="tempCanvas"
      width="600"
      height="600"
      style="display: none"
    ></canvas>
    <div id="fisheye-menu">
      <p id="fisheye-allow-rotate">Rotate</p>
      <p id="fisheye-allow-move">Move</p>
      <p id="fisheye-delete-polygon">Delete</p>
    </div>

    <div id="zoom-menu" class="dropdown">
      <p id="zoom-allow-rotate">Rotate</p>
      <p id="zoom-allow-move">Move</p>
      <p id="zoom-delete-polygon">Delete</p>
      <div class="dropbtn-area">
        <button class="dropbtn">Angle</button>
        <div
          style="
            width: 224px;
            position: absolute;
            left: 160px;
            top: 120px;
            height: 400px;
            opacity: 0;
          "
        >
          Angle
        </div>
        <div class="dropdown-content">
          <p onclick="changeZoomAngle(30)">30°</p>
          <p onclick="changeZoomAngle(50)">50°</p>
          <p onclick="changeZoomAngle(70)">70°</p>
          <p onclick="changeZoomAngle(90)">90°</p>
          <p onclick="changeZoomAngle(110)">110°</p>
        </div>
      </div>
    </div>

    <script src="constants.js"></script>
    <script src="util.js"></script>
    <script src="ui.js"></script>
    <script src="canvas.js"></script>
    <script src="draggable-polygon.js"></script>
    <script src="solution.js"></script>
    <script src="polygon_data.js"></script>
    <script src="camera-vision.js"></script>
    <script src="camera.js"></script>
    <script src="global.js"></script>
  </body>
</html>
