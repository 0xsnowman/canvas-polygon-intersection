<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Polygon Clipping and Merging</title>
    <style>
      canvas {
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <canvas
      id="tempCanvas"
      width="500"
      height="500"
      style="display: none"
    ></canvas>
    <canvas id="finalCanvas" width="500" height="500"></canvas>
    <button id="rotate_btn">Rotate +</button>

    <script src="canvas.js"></script>
    <script src="draggable-polygon.js"></script>
    <script src="solution.js"></script>
    <script src="polygon_data.js"></script>
    <script src="camera-vision.js"></script>
    <script>
      const out_pol = [
        { x: 500, y: 300 },
        { x: 461, y: 417 },
        { x: 376, y: 495 },
        { x: 263, y: 495 },
        { x: 178, y: 417 },
        { x: 140, y: 300 },
        { x: 178, y: 182 },
        { x: 263, y: 104 },
        { x: 376, y: 104 },
        { x: 461, y: 182 },
      ];

      const in_pol1 = [
        { x: 450, y: 300 },
        { x: 421, y: 394 },
        { x: 359, y: 457 },
        { x: 241, y: 457 },
        { x: 179, y: 394 },
        { x: 150, y: 300 },
        { x: 179, y: 206 },
        { x: 241, y: 143 },
        { x: 359, y: 143 },
        { x: 421, y: 206 },
      ];
      const in_pol2 = [
        { x: 400, y: 300 },
        { x: 371, y: 380 },
        { x: 321, y: 421 },
        { x: 239, y: 421 },
        { x: 199, y: 380 },
        { x: 200, y: 300 },
        { x: 199, y: 220 },
        { x: 239, y: 179 },
        { x: 321, y: 179 },
        { x: 371, y: 220 },
      ];

      const center = { x: 300, y: 300 };
      const rotation = 0;

      var cameraVision = new CameraVision(
        center,
        rotation,
        in_pol1,
        in_pol2,
        out_pol
      );

      document.getElementById("rotate_btn").addEventListener("click", () => {
        cameraVision.rotate(5);
      });
    </script>
  </body>
</html>
