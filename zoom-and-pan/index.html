<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom & Pan Image on Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Burger Icon to Toggle Panel -->
  <div id="burgerIcon" class="burger-icon" onclick="togglePanel()">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- Side Panel Left -->
  <div id="sidePanel" class="side-panel hidden">
    <!-- Close Button -->
    <div id="closeButton" class="close-btn" onclick="closePanel()">×</div>
    
    <input type="file" id="fileInput" accept="image/*">
    <div class="buttons">
      <button id="camera1">Camera 1</button>
      <button id="camera2">Camera 2</button>
      <button id="camera3">Camera 3</button>
      <button id="camera4">Camera 4</button>
      <button id="camera5">Camera 5</button>
      <button id="camera6">Camera 6</button>
    </div>
    <label>
      <input type="checkbox" id="showPointIndex">
      Show Point Index
    </label>
  </div>

  <!-- Canvas Area -->
  <canvas id="myCanvas"></canvas>

  <!-- State Panel Right -->
  <div id="statePanel">
    <div id="statePanelCloseButton" class="close-btn" onclick="closeStatePanel()">×</div>
    <h3>Canvas State</h3>
    <p><strong>Scale:</strong> <span id="scaleValue">1</span></p>
    <p><strong>Origin X:</strong> <span id="originXValue">0</span></p>
    <p><strong>Origin Y:</strong> <span id="originYValue">0</span></p>
    <p><strong>Canvas Width:</strong> <span id="canvasWidth">0</span></p>
    <p><strong>Canvas Height:</strong> <span id="canvasHeight">0</span></p>
    <h3>Mouse State</h3>
    <p><strong>Logical X:</strong> <span id="mouseXValue">0</span></p>
    <p><strong>Logical Y:</strong> <span id="mouseYValue">0</span></p>
    <p><strong>Is Dragging:</strong> <span id="isDraggingValue">false</span></p>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/events.js"></script>
  <script src="js/state.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
